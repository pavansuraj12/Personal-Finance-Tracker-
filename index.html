<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0f14">
  <title>FinTrack — Personal Finance</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet"
    href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    /* ============================================================
   PERSONAL FINANCE TRACKER — styles.css
   Font: Clash Display (headings) + Satoshi (body)
   ============================================================ */

    @import url('https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap');

    /* ── VARIABLES ─────────────────────────────────────────────── */
    :root {
      --font-head: 'Clash Display', sans-serif;
      --font-body: 'Satoshi', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-w: 260px;
      --topbar-h: 64px;
      --nav-h: 68px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.18);
    }

    [data-theme="dark"] {
      --bg: #0d0f14;
      --bg-2: #13161d;
      --bg-3: #1a1e28;
      --bg-4: #222636;
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text: #f0f2f8;
      --text-2: #8892a4;
      --text-3: #4a5568;
      --accent: #6366f1;
      --accent-2: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.1);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --card-bg: #13161d;
      --modal-bg: rgba(13, 15, 20, 0.85);
      --nav-bg: rgba(19, 22, 29, 0.92);
      --input-bg: #1a1e28;
    }

    [data-theme="light"] {
      --bg: #f5f6fa;
      --bg-2: #ffffff;
      --bg-3: #f0f2f8;
      --bg-4: #e8eaf4;
      --border: rgba(0, 0, 0, 0.07);
      --border-hover: rgba(0, 0, 0, 0.15);
      --text: #0d0f14;
      --text-2: #5a6478;
      --text-3: #9aa3b8;
      --accent: #6366f1;
      --accent-2: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --green: #059669;
      --green-bg: rgba(5, 150, 105, 0.08);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.08);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.08);
      --card-bg: #ffffff;
      --modal-bg: rgba(245, 246, 250, 0.88);
      --nav-bg: rgba(255, 255, 255, 0.92);
      --input-bg: #f0f2f8;
    }

    /* ── RESET ─────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background var(--transition-slow), color var(--transition-slow);
    }

    button {
      cursor: pointer;
      font-family: var(--font-body);
      border: none;
      background: none;
    }

    input,
    select,
    textarea {
      font-family: var(--font-body);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    /* ── PIN SCREEN ────────────────────────────────────────────── */
    #pin-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 32px;
    }

    #pin-screen.hidden {
      display: none;
    }

    .pin-logo {
      font-family: var(--font-head);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .pin-logo span {
      color: var(--accent);
    }

    .pin-subtitle {
      color: var(--text-2);
      font-size: 0.9rem;
      text-align: center;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      margin: 8px 0;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-hover);
      background: transparent;
      transition: all var(--transition);
    }

    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: scale(1.1);
    }

    .pin-dot.error {
      background: var(--red);
      border-color: var(--red);
      animation: shake 0.4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-6px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 12px;
    }

    .pin-key {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      font-size: 1.4rem;
      font-family: var(--font-head);
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      user-select: none;
    }

    .pin-key:active,
    .pin-key:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: scale(0.95);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .pin-key.del {
      font-size: 1rem;
      color: var(--text-2);
    }

    .pin-key.del:hover {
      background: var(--red-bg);
      color: var(--red);
      border-color: var(--red);
    }

    .pin-attempts {
      color: var(--red);
      font-size: 0.85rem;
      min-height: 20px;
      text-align: center;
    }

    /* ── APP LAYOUT ────────────────────────────────────────────── */
    #app {
      display: none;
      min-height: 100vh;
    }

    #app.ready {
      display: flex;
    }

    /* Sidebar (desktop) */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform var(--transition-slow);
    }

    .sidebar-logo {
      padding: 24px 24px 20px;
      font-family: var(--font-head);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo span {
      color: var(--accent);
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      font-weight: 600;
      padding: 0 12px;
      margin: 16px 0 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      margin-bottom: 2px;
      position: relative;
    }

    .nav-item:hover {
      background: var(--bg-3);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent-2);
      font-weight: 600;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--accent);
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 1.1rem;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      min-width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-toggle {
      display: flex;
      background: var(--bg-3);
      border-radius: 99px;
      padding: 4px;
      gap: 2px;
      border: 1px solid var(--border);
    }

    .theme-btn {
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-3);
      transition: all var(--transition);
    }

    .theme-btn.active {
      background: var(--bg-2);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Main content */
    .main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      height: var(--topbar-h);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border-radius: 99px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all var(--transition);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .fab:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .fab .fab-icon {
      font-size: 1.1rem;
    }

    /* Page content */
    .page {
      display: none;
      padding: 28px;
      animation: fadeSlide 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── CARDS ─────────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color var(--transition);
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-2);
    }

    /* ── GRID LAYOUTS ──────────────────────────────────────────── */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .grid-auto {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── STAT CARDS ────────────────────────────────────────────── */
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0.7;
    }

    .stat-card.income::before {
      background: var(--green);
    }

    .stat-card.expense::before {
      background: var(--red);
    }

    .stat-card.transfer::before {
      background: var(--amber);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-2);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      font-family: var(--font-head);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      margin: 6px 0 4px;
      letter-spacing: -0.03em;
    }

    .stat-sub {
      font-size: 0.78rem;
      color: var(--text-3);
    }

    .stat-icon {
      position: absolute;
      right: 16px;
      top: 16px;
      font-size: 1.4rem;
      opacity: 0.3;
    }

    /* ── BANK CARDS ────────────────────────────────────────────── */
    .bank-card {
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
      min-height: 120px;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .bank-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .bank-card-noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .bank-card-icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .bank-card-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .bank-card-balance {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      margin-top: 4px;
      letter-spacing: -0.03em;
    }

    .bank-card-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .bank-card:hover .bank-card-actions {
      opacity: 1;
    }

    .bank-card-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: background var(--transition);
    }

    .bank-card-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ── TRANSACTION LIST ──────────────────────────────────────── */
    .txn-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .txn-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
      cursor: pointer;
    }

    .txn-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-3);
    }

    .txn-cat-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .txn-info {
      flex: 1;
      min-width: 0;
    }

    .txn-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .txn-meta {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .txn-bank-tag {
      background: var(--bg-4);
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-2);
    }

    .txn-amount {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .txn-amount.expense {
      color: var(--red);
    }

    .txn-amount.income {
      color: var(--green);
    }

    .txn-del {
      opacity: 0;
      color: var(--text-3);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .txn-item:hover .txn-del {
      opacity: 1;
    }

    .txn-del:hover {
      background: var(--red-bg);
      color: var(--red);
    }

    /* ── FILTERS ───────────────────────────────────────────────── */
    .filter-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-chip {
      padding: 7px 16px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-2);
      background: var(--card-bg);
      cursor: pointer;
      transition: all var(--transition);
    }

    .filter-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-chip.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent-2);
      font-weight: 600;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      transition: border-color var(--transition);
      flex: 1;
      min-width: 200px;
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.875rem;
      flex: 1;
    }

    .search-box input::placeholder {
      color: var(--text-3);
    }

    /* ── CALENDAR ──────────────────────────────────────────────── */
    .calendar-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .cal-nav {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--text-2);
      transition: all var(--transition);
    }

    .cal-nav:hover {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: var(--accent);
    }

    .cal-month {
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      padding: 8px 0;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid transparent;
      position: relative;
      padding: 4px;
      min-height: 52px;
    }

    .cal-day:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .cal-day.empty {
      pointer-events: none;
    }

    .cal-day.today .cal-day-num {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-day.selected {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .cal-day-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .cal-day-amount {
      font-size: 0.6rem;
      font-weight: 600;
      margin-top: 2px;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Heatmap colors */
    .heat-0 {
      background: transparent;
    }

    .heat-1 {
      background: rgba(16, 185, 129, 0.12);
    }

    .heat-2 {
      background: rgba(245, 158, 11, 0.15);
    }

    .heat-3 {
      background: rgba(239, 68, 68, 0.15);
    }

    .heat-4 {
      background: rgba(239, 68, 68, 0.28);
    }

    /* ── CHARTS ────────────────────────────────────────────────── */
    .chart-container {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .chart-wrap {
      position: relative;
    }

    .chart-wrap canvas {
      max-width: 100%;
    }

    /* ── PROGRESS BAR ──────────────────────────────────────────── */
    .progress-bar {
      height: 8px;
      background: var(--bg-4);
      border-radius: 99px;
      overflow: hidden;
      margin: 10px 0 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-fill.warn {
      background: var(--amber);
    }

    .progress-fill.danger {
      background: var(--red);
    }

    /* ── PEOPLE / DUES ─────────────────────────────────────────── */
    .due-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .due-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-head);
      flex-shrink: 0;
    }

    .due-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .due-reason {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 2px;
    }

    .due-meta {
      flex: 1;
    }

    .due-right {
      text-align: right;
      flex-shrink: 0;
    }

    .due-amount {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
    }

    .due-amount.lent {
      color: var(--red);
    }

    .due-amount.borrowed {
      color: var(--green);
    }

    .due-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      justify-content: flex-end;
    }

    .btn-done {
      padding: 4px 12px;
      background: var(--green-bg);
      color: var(--green);
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    .btn-done:hover {
      background: var(--green);
      color: white;
    }

    /* ── SAVINGS GOALS ─────────────────────────────────────────── */
    .goal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all var(--transition);
    }

    .goal-card:hover {
      border-color: var(--border-hover);
    }

    .goal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .goal-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .goal-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .goal-subtitle {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 2px;
    }

    .goal-amounts {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8rem;
      color: var(--text-3);
      margin-top: 8px;
    }

    .goal-current {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── MODAL ─────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow);
      padding: 20px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(16px) scale(0.97);
      transition: transform var(--transition-slow);
      box-shadow: var(--shadow-lg);
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title {
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg-3);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--red-bg);
      color: var(--red);
    }

    /* ── FORM ELEMENTS ─────────────────────────────────────────── */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--transition);
      appearance: none;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--accent);
    }

    .form-input::placeholder {
      color: var(--text-3);
    }

    .type-toggle {
      display: flex;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
    }

    .type-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-2);
      transition: all var(--transition);
    }

    .type-btn.active.expense {
      background: var(--red);
      color: white;
    }

    .type-btn.active.income {
      background: var(--green);
      color: white;
    }

    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform var(--transition);
      border: 2px solid transparent;
    }

    .color-swatch:hover {
      transform: scale(1.15);
    }

    .color-swatch.selected {
      border-color: var(--text);
      transform: scale(1.1);
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .emoji-opt {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all var(--transition);
    }

    .emoji-opt:hover,
    .emoji-opt.selected {
      background: var(--accent-glow);
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all var(--transition);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: var(--bg-3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── TABS ──────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 4px;
    }

    .tab {
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-3);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--text-2);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── SECTION HEADER ────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: var(--font-head);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-2);
    }

    .btn-link {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      transition: opacity var(--transition);
    }

    .btn-link:hover {
      opacity: 0.7;
    }

    /* ── TOAST ─────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: calc(var(--nav-h) + 16px);
      right: 20px;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      box-shadow: var(--shadow-md);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 300px;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success {
      border-left: 3px solid var(--green);
    }

    .toast.error {
      border-left: 3px solid var(--red);
    }

    .toast.info {
      border-left: 3px solid var(--accent);
    }

    /* ── EMPTY STATE ───────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-3);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state-text {
      font-size: 0.9rem;
    }

    /* ── SLIDE PANEL (calendar day detail) ────────────────────── */
    .slide-panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 360px;
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      z-index: 200;
      transform: translateX(100%);
      transition: transform var(--transition-slow);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }

    .slide-panel.open {
      transform: translateX(0);
    }

    .slide-panel-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-panel-title {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
    }

    .slide-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    /* ── MOBILE ────────────────────────────────────────────────── */
    .mobile-topbar {
      display: none;
      height: var(--topbar-h);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .mobile-topbar-title {
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding: 0 8px;
      align-items: center;
    }

    .bottom-nav-items {
      display: flex;
      width: 100%;
      justify-content: space-around;
      align-items: center;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all var(--transition);
      min-width: 52px;
      color: var(--text-3);
    }

    .bottom-nav-item.active {
      color: var(--accent);
    }

    .bottom-nav-item:hover {
      color: var(--accent);
      background: var(--accent-glow);
    }

    .bottom-nav-icon {
      font-size: 1.2rem;
    }

    .bottom-nav-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .bottom-nav-fab {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all var(--transition);
    }

    .bottom-nav-fab:hover {
      transform: scale(1.05);
    }

    /* ── MORE MENU ─────────────────────────────────────────────── */
    .more-menu {
      position: fixed;
      bottom: calc(var(--nav-h) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      z-index: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: all var(--transition-slow);
      width: 220px;
    }

    .more-menu.open {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .more-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-2);
      transition: all var(--transition);
    }

    .more-menu-item:hover {
      background: var(--bg-3);
      color: var(--text);
    }

    /* ── RESPONSIVE ────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding-bottom: var(--nav-h);
      }

      .topbar {
        display: none;
      }

      .mobile-topbar {
        display: flex;
      }

      .bottom-nav {
        display: flex;
      }

      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .page {
        padding: 16px;
      }

      .slide-panel {
        width: 100%;
      }

      #toast-container {
        bottom: calc(var(--nav-h) + 12px);
        right: 12px;
        left: 12px;
      }

      .toast {
        max-width: 100%;
      }
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .grid-3 {
        grid-template-columns: 1fr;
      }

      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 20px;
      }
    }

    /* ── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-4);
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-3);
    }

    /* ── LOADING ───────────────────────────────────────────────── */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-3) 25%, var(--bg-4) 50%, var(--bg-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    /* ── REPORT CARD ───────────────────────────────────────────── */
    .report-highlight {
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      border-radius: var(--radius);
      padding: 24px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .report-highlight::before {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ── MISC ──────────────────────────────────────────────────── */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--bg-4);
      color: var(--text-2);
    }

    .tag.recurring {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .mt-4 {
      margin-top: 16px;
    }

    .mt-6 {
      margin-top: 24px;
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .flex {
      display: flex;
    }

    .flex-center {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gap-2 {
      gap: 8px;
    }

    .gap-3 {
      gap: 12px;
    }

    .text-sm {
      font-size: 0.85rem;
    }

    .text-xs {
      font-size: 0.75rem;
    }

    .text-muted {
      color: var(--text-2);
    }

    .text-faint {
      color: var(--text-3);
    }

    .font-bold {
      font-weight: 700;
    }

    .w-full {
      width: 100%;
    }
  </style>
</head>

<body>

  <div id="pin-screen">
    <div class="pin-logo">Fin<span>Track</span></div>
    <p class="pin-subtitle">Enter your PIN to continue</p>
    <div class="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="handlePinKey('1')">1</button>
      <button class="pin-key" onclick="handlePinKey('2')">2</button>
      <button class="pin-key" onclick="handlePinKey('3')">3</button>
      <button class="pin-key" onclick="handlePinKey('4')">4</button>
      <button class="pin-key" onclick="handlePinKey('5')">5</button>
      <button class="pin-key" onclick="handlePinKey('6')">6</button>
      <button class="pin-key" onclick="handlePinKey('7')">7</button>
      <button class="pin-key" onclick="handlePinKey('8')">8</button>
      <button class="pin-key" onclick="handlePinKey('9')">9</button>
      <div></div>
      <button class="pin-key" onclick="handlePinKey('0')">0</button>
      <button class="pin-key del" onclick="handlePinDel()">&#9003;</button>
    </div>
    <p class="pin-attempts"></p>
  </div>

  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-logo">Fin<span>Track</span></div>
      <nav class="sidebar-nav">
        <div class="nav-label">Overview</div>
        <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><span
            class="nav-icon">&#127968;</span> Dashboard</div>
        <div class="nav-item" data-page="banks" onclick="navigate('banks')"><span class="nav-icon">&#127982;</span>
          Banks</div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const { createClient } = supabase;
    let _db = null;
    function getDb() {
      if (!_db) {
        if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE')) {
          throw new Error('Supabase keys not configured.');
        }
        _db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return _db;
    }

    // ── HELPERS ───────────────────────────────────────────────────
    async function fetchBankMap(ids) {
      if (!ids.length) return {};
      const { data } = await getDb().from('banks').select('id,name,color,icon').in('id', ids);
      return Object.fromEntries((data || []).map(b => [b.id, b]));
    }
    async function fetchCatMap(ids) {
      if (!ids.length) return {};
      const { data } = await getDb().from('categories').select('id,name,color,icon').in('id', ids);
      return Object.fromEntries((data || []).map(c => [c.id, c]));
    }

    // ── SETTINGS ──────────────────────────────────────────────────
    const Settings = {
      async get() {
        const { data, error } = await getDb().from('settings').select('*').eq('id', 1).single();
        if (error) throw error;
        return data;
      },
      async save(updates) {
        const { data, error } = await getDb().from('settings').update(updates).eq('id', 1).select().single();
        if (error) throw error;
        return data;
      }
    };

    // ── BANKS ─────────────────────────────────────────────────────
    const Banks = {
      async getAll() {
        const { data, error } = await getDb().from('banks').select('*').order('created_at');
        if (error) throw error;
        return data || [];
      },
      async add(bank) {
        const { data, error } = await getDb().from('banks').insert(bank).select().single();
        if (error) throw error;
        return data;
      },
      async update(id, updates) {
        const { data, error } = await getDb().from('banks').update(updates).eq('id', id).select().single();
        if (error) throw error;
        return data;
      },
      async delete(id) {
        const { error } = await getDb().from('banks').delete().eq('id', id);
        if (error) throw error;
      }
    };

    // ── CATEGORIES ────────────────────────────────────────────────
    const Categories = {
      async getAll() {
        const { data, error } = await getDb().from('categories').select('*')
          .order('is_default', { ascending: false }).order('name');
        if (error) throw error;
        return data || [];
      },
      async add(cat) {
        const { data, error } = await getDb().from('categories').insert(cat).select().single();
        if (error) throw error;
        return data;
      },
      async update(id, updates) {
        const { data, error } = await getDb().from('categories').update(updates).eq('id', id).select().single();
        if (error) throw error;
        return data;
      },
      async delete(id) {
        const { error } = await getDb().from('categories').delete().eq('id', id);
        if (error) throw error;
      }
    };

    // ── TRANSACTIONS ──────────────────────────────────────────────
    const Transactions = {
      async getAll(filters = {}) {
        let q = getDb().from('transactions').select('*')
          .order('date', { ascending: false })
          .order('created_at', { ascending: false });

        if (filters.bank_id) q = q.eq('bank_id', filters.bank_id);
        if (filters.category_id) q = q.eq('category_id', filters.category_id);
        if (filters.type) q = q.eq('type', filters.type);
        if (filters.from) q = q.gte('date', filters.from);
        if (filters.to) q = q.lte('date', filters.to);
        if (filters.month) {
          const [y, m] = filters.month.split('-');
          const from = `${y}-${m}-01`;
          const daysInMonth = new Date(parseInt(y), parseInt(m), 0).getDate();
          const to = `${y}-${m}-${String(daysInMonth).padStart(2, '0')}`;
          q = q.gte('date', from).lte('date', to);
        }

        const { data, error } = await q;
        if (error) throw error;
        const txns = data || [];
        if (!txns.length) return [];

        const bankIds = [...new Set(txns.map(t => t.bank_id).filter(Boolean))];
        const catIds = [...new Set(txns.map(t => t.category_id).filter(Boolean))];
        const [bankMap, catMap] = await Promise.all([fetchBankMap(bankIds), fetchCatMap(catIds)]);

        return txns.map(t => ({
          ...t,
          banks: bankMap[t.bank_id] || null,
          categories: catMap[t.category_id] || null
        }));
      },

      async getById(id) {
        const { data, error } = await getDb().from('transactions').select('*').eq('id', id).single();
        if (error) throw error;
        const t = data;
        const [bankMap, catMap] = await Promise.all([
          fetchBankMap(t.bank_id ? [t.bank_id] : []),
          fetchCatMap(t.category_id ? [t.category_id] : [])
        ]);
        return { ...t, banks: bankMap[t.bank_id] || null, categories: catMap[t.category_id] || null };
      },

      async add(txn) {
        const { data, error } = await getDb().rpc('add_transaction', {
          p_bank_id: txn.bank_id,
          p_category_id: txn.category_id || null,
          p_type: txn.type,
          p_amount: txn.amount,
          p_note: txn.note || '',
          p_date: txn.date,
          p_is_recurring: txn.is_recurring || false,
          p_recurring_interval: txn.recurring_interval || null
        });
        if (error) throw error;
        return data;
      },

      async delete(id) {
        const { error } = await getDb().rpc('delete_transaction', { p_txn_id: id });
        if (error) throw error;
      },
      async update(txn) {
        // Step 1: get old transaction values
        const { data: old, error: e1 } = await getDb().from('transactions')
          .select('bank_id,type,amount').eq('id', txn.id).single();
        if (e1) throw e1;

        // Step 2: reverse old bank balance effect
        const { data: oldBank, error: e2 } = await getDb().from('banks')
          .select('balance').eq('id', old.bank_id).single();
        if (e2) throw e2;
        const reversedBal = old.type === 'expense'
          ? Number(oldBank.balance) + Number(old.amount)
          : Number(oldBank.balance) - Number(old.amount);
        const { error: e3 } = await getDb().from('banks')
          .update({ balance: reversedBal }).eq('id', old.bank_id);
        if (e3) throw e3;

        // Step 3: update the transaction record
        const { error: e4 } = await getDb().from('transactions').update({
          bank_id: txn.bank_id,
          category_id: txn.category_id || null,
          type: txn.type,
          amount: txn.amount,
          note: txn.note || '',
          date: txn.date,
          is_recurring: txn.is_recurring || false,
          recurring_interval: txn.recurring_interval || null
        }).eq('id', txn.id);
        if (e4) throw e4;

        // Step 4: apply new bank balance effect
        const { data: newBank, error: e5 } = await getDb().from('banks')
          .select('balance').eq('id', txn.bank_id).single();
        if (e5) throw e5;
        const newBal = txn.type === 'expense'
          ? Number(newBank.balance) - Number(txn.amount)
          : Number(newBank.balance) + Number(txn.amount);
        const { error: e6 } = await getDb().from('banks')
          .update({ balance: newBal }).eq('id', txn.bank_id);
        if (e6) throw e6;
      },

      async getByDate(date) {
        const { data, error } = await getDb().from('transactions').select('*')
          .eq('date', date).order('created_at', { ascending: false });
        if (error) throw error;
        const txns = data || [];
        if (!txns.length) return [];
        const bankIds = [...new Set(txns.map(t => t.bank_id).filter(Boolean))];
        const catIds = [...new Set(txns.map(t => t.category_id).filter(Boolean))];
        const [bankMap, catMap] = await Promise.all([fetchBankMap(bankIds), fetchCatMap(catIds)]);
        return txns.map(t => ({ ...t, banks: bankMap[t.bank_id] || null, categories: catMap[t.category_id] || null }));
      },

      async getMonthlyTotals(year, month) {
        const m = String(month).padStart(2, '0');
        const daysInMonth = new Date(parseInt(year), parseInt(month), 0).getDate();
        const from = `${year}-${m}-01`;
        const to = `${year}-${m}-${String(daysInMonth).padStart(2, '0')}`;
        const { data, error } = await getDb().from('transactions')
          .select('date,type,amount').gte('date', from).lte('date', to);
        if (error) throw error;
        return data || [];
      }
    };

    // ── TRANSFERS ─────────────────────────────────────────────────
    const Transfers = {
      async transfer(fromId, toId, amount, note, date) {
        const { error } = await getDb().rpc('transfer_between_banks', {
          p_from_bank_id: fromId,
          p_to_bank_id: toId,
          p_amount: amount,
          p_note: note || '',
          p_date: date
        });
        if (error) throw error;
      }
    };

    // ── PEOPLE DUES ───────────────────────────────────────────────
    const PeopleDues = {
      async getActive() {
        const { data, error } = await getDb().from('people_dues')
          .select('*').eq('status', 'pending').order('date', { ascending: false });
        if (error) throw error;
        const dues = data || [];
        const bankIds = [...new Set(dues.map(d => d.bank_id).filter(Boolean))];
        const bankMap = await fetchBankMap(bankIds);
        return dues.map(d => ({ ...d, banks: bankMap[d.bank_id] || null }));
      },
      async getHistory() {
        const { data, error } = await getDb().from('people_dues')
          .select('*').eq('status', 'returned').order('settled_at', { ascending: false });
        if (error) throw error;
        const dues = data || [];
        const bankIds = [...new Set(dues.map(d => d.bank_id).filter(Boolean))];
        const bankMap = await fetchBankMap(bankIds);
        return dues.map(d => ({ ...d, banks: bankMap[d.bank_id] || null }));
      },
      async add(due) {
        const { data, error } = await getDb().from('people_dues').insert(due).select().single();
        if (error) throw error;
        return data;
      },
      async settle(id) {
        const { error } = await getDb().rpc('settle_due', { p_due_id: id });
        if (error) throw error;
      },
      async addPartialPayment(id, amount, overrideBankId = null) {
        // Step 1: get current due details
        const { data: due, error: e1 } = await getDb().from('people_dues')
          .select('*').eq('id', id).single();
        if (e1) throw e1;

        const newPaid = Number(due.amount_paid || 0) + Number(amount);
        const isFullyPaid = newPaid >= Number(due.amount) - 0.01;

        // Step 2: update amount_paid (and status if fully paid)
        const updates = isFullyPaid
          ? { amount_paid: newPaid, status: 'returned', settled_at: new Date().toISOString() }
          : { amount_paid: newPaid };
        const { error: e2 } = await getDb().from('people_dues').update(updates).eq('id', id);
        if (e2) throw e2;

        // Step 3: update selected bank balance (overrideBankId takes priority)
        const targetBankId = overrideBankId || due.bank_id;
        if (targetBankId) {
          const { data: bank, error: e3 } = await getDb().from('banks')
            .select('balance').eq('id', targetBankId).single();
          if (e3) throw e3;
          const newBal = due.due_type === 'lent'
            ? Number(bank.balance) + Number(amount)   // money coming back in
            : Number(bank.balance) - Number(amount);  // money going out
          const { error: e4 } = await getDb().from('banks')
            .update({ balance: newBal }).eq('id', targetBankId);
          if (e4) throw e4;
        }
      },
      async revertToPending(id) {
        const { data: due, error: fetchErr } = await getDb().from('people_dues').select('*').eq('id', id).single();
        if (fetchErr) throw fetchErr;
        const paidSoFar = Number(due.amount_paid || 0);
        const totalAmount = Number(due.amount);

        if (due.bank_id) {
          const { data: bank } = await getDb().from('banks').select('balance').eq('id', due.bank_id).single();
          if (bank) {
            let newBal = Number(bank.balance);
            if (due.due_type === 'lent') {
              // Originally deducted 'totalAmount', then credited back 'paidSoFar'
              // Net effect on bank = -totalAmount + paidSoFar
              // To fully revert: undo net = +totalAmount - paidSoFar
              newBal = newBal - paidSoFar + totalAmount;
            } else {
              // Originally added 'totalAmount', then debited back 'paidSoFar'
              // To fully revert: undo = -totalAmount + paidSoFar
              newBal = newBal + paidSoFar - totalAmount;
            }
            await getDb().from('banks').update({ balance: newBal }).eq('id', due.bank_id);
          }
        }
        const { error } = await getDb().from('people_dues')
          .update({ status: 'pending', settled_at: null, amount_paid: 0 }).eq('id', id);
        if (error) throw error;
      },
      async delete(id) {
        const { error } = await getDb().from('people_dues').delete().eq('id', id);
        if (error) throw error;
      }
    };

    // ── SAVINGS GOALS ─────────────────────────────────────────────
    const SavingsGoals = {
      async getActive() {
        const { data, error } = await getDb().from('savings_goals')
          .select('*').eq('status', 'active').order('created_at');
        if (error) throw error;
        const goals = data || [];
        const bankIds = [...new Set(goals.map(g => g.bank_id).filter(Boolean))];
        const bankMap = await fetchBankMap(bankIds);
        return goals.map(g => ({ ...g, banks: bankMap[g.bank_id] || null }));
      },
      async getArchived() {
        const { data, error } = await getDb().from('savings_goals')
          .select('*').in('status', ['completed', 'archived']).order('completed_at', { ascending: false });
        if (error) throw error;
        const goals = data || [];
        const bankIds = [...new Set(goals.map(g => g.bank_id).filter(Boolean))];
        const bankMap = await fetchBankMap(bankIds);
        return goals.map(g => ({ ...g, banks: bankMap[g.bank_id] || null }));
      },
      async add(goal) {
        const { data, error } = await getDb().from('savings_goals').insert(goal).select().single();
        if (error) throw error;
        return data;
      },
      async update(id, updates) {
        const { data, error } = await getDb().from('savings_goals').update(updates).eq('id', id).select().single();
        if (error) throw error;
        return data;
      },
      async complete(id) {
        const { error } = await getDb().from('savings_goals')
          .update({ status: 'completed', completed_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
      },
      async delete(id) {
        const { error } = await getDb().from('savings_goals').delete().eq('id', id);
        if (error) throw error;
      }
    };

    // ── ANALYTICS ─────────────────────────────────────────────────
    const Analytics = {
      async getCategoryBreakdown(month) {
        const txns = await Transactions.getAll({ month, type: 'expense' });
        const map = {};
        txns.forEach(t => {
          const key = t.categories?.name || 'Other';
          const color = t.categories?.color || '#94a3b8';
          const icon = t.categories?.icon || '📌';
          if (!map[key]) map[key] = { name: key, color, icon, total: 0 };
          map[key].total += Number(t.amount);
        });
        return Object.values(map).sort((a, b) => b.total - a.total);
      },
      async getDailyTrend(month) {
        const [y, m] = month.split('-');
        const txns = await Transactions.getMonthlyTotals(y, m);
        const days = {};
        txns.forEach(t => {
          if (!days[t.date]) days[t.date] = { income: 0, expense: 0 };
          days[t.date][t.type] += Number(t.amount);
        });
        return days;
      }
    };


    // ── STATE ──────────────────────────────────────────────────────
    const State = {
      authenticated: false,
      initialized: false,
      theme: 'dark',
      currentPage: 'dashboard',
      banks: [],
      categories: [],
      settings: null,
      calendarDate: new Date(),
      txnFilters: { type: '', bank_id: '', category_id: '', search: '' },
      txnMonth: '',
    };

    // ── UTILS ───────────────────────────────────────────────────────
    const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const today = () => new Date().toISOString().split('T')[0];
    const monthStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const monthLabel = d => d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    const dateLabel = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function errCard(msg) {
      return `<div class="card" style="border-color:var(--red);padding:24px;text-align:center">
    <div style="font-size:1.5rem;margin-bottom:8px">⚠️</div>
    <div style="color:var(--red);font-weight:600;margin-bottom:4px">Failed to load</div>
    <div style="font-size:0.8rem;color:var(--text-3)">${msg}</div>
  </div>`;
    }

    // ── TOAST ───────────────────────────────────────────────────────
    function toast(msg, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️' };
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.classList.add('show'), 10);
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
    }

    // ── PIN SCREEN ──────────────────────────────────────────────────
    let pinInput = '', pinAttempts = 0, pinSetupMode = false, pinSetupFirst = '';

    function initPin() { /* inline onclick handlers on buttons handle this */ }

    function handlePinKey(val) {
      if (pinInput.length >= 4) return;
      pinInput += val;
      updatePinDots();
      if (pinInput.length === 4) setTimeout(submitPin, 180);
    }

    function handlePinDel() {
      pinInput = pinInput.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots(error = false) {
      document.querySelectorAll('.pin-dot').forEach((d, i) => {
        d.className = 'pin-dot' + (i < pinInput.length ? ' filled' : '') + (error ? ' error' : '');
      });
    }

    async function submitPin() {
      const hash = await sha256(pinInput);
      if (pinSetupMode) {
        if (!pinSetupFirst) {
          pinSetupFirst = hash; pinInput = '';
          updatePinDots();
          document.querySelector('.pin-subtitle').textContent = 'Confirm your PIN';
          return;
        }
        if (hash !== pinSetupFirst) {
          updatePinDots(true); pinInput = ''; pinSetupFirst = '';
          document.querySelector('.pin-subtitle').textContent = 'PINs did not match. Try again.';
          setTimeout(() => { updatePinDots(); document.querySelector('.pin-subtitle').textContent = 'Set a new 4-digit PIN'; }, 1500);
          return;
        }
        await Settings.save({ pin_hash: hash });
        State.settings.pin_hash = hash;
        unlockApp(); return;
      }
      if (hash === State.settings.pin_hash) {
        unlockApp();
      } else {
        pinAttempts++;
        updatePinDots(true); pinInput = '';
        const remaining = 3 - pinAttempts;
        if (pinAttempts >= 3) {
          document.querySelector('.pin-attempts').textContent = '🔒 Too many attempts. Wait 30s';
          document.querySelectorAll('.pin-key').forEach(k => k.style.pointerEvents = 'none');
          setTimeout(() => { pinAttempts = 0; document.querySelectorAll('.pin-key').forEach(k => k.style.pointerEvents = ''); document.querySelector('.pin-attempts').textContent = ''; updatePinDots(); }, 30000);
        } else {
          document.querySelector('.pin-attempts').textContent = `Wrong PIN. ${remaining} attempt${remaining > 1 ? 's' : ''} left.`;
          setTimeout(() => updatePinDots(), 400);
        }
      }
    }

    // ── CALENDAR ─────────────────────────────────────────────────────
    async function renderCalendar() {
      try {
        const year = State.calendarDate.getFullYear(), month = State.calendarDate.getMonth();
        const m0 = String(month + 1).padStart(2, '0');
        const dailyData = await Analytics.getDailyTrend(`${year}-${m0}`);
        const amounts = Object.values(dailyData).map(d => d.expense).filter(v => v > 0);
        const maxAmt = amounts.length ? Math.max(...amounts) : 1;
        function heatLevel(amt) {
          if (!amt) return 0;
          const r = amt / maxAmt;
          return r < 0.25 ? 1 : r < 0.5 ? 2 : r < 0.75 ? 3 : 4;
        }
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayStr = today();
        let cells = '';
        for (let i = 0; i < firstDay; i++) cells += `<div class="cal-day empty"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = `${year}-${m0}-${String(d).padStart(2, '0')}`;
          const dd = dailyData[ds] || { expense: 0, income: 0 };
          const heat = heatLevel(dd.expense);
          const isToday = ds === todayStr;
          cells += `<div class="cal-day heat-${heat} ${isToday ? 'today' : ''}" onclick="openDayPanel('${ds}')">
        <div class="cal-day-num">${d}</div>
        ${dd.expense > 0 ? `<div class="cal-day-amount" style="color:var(--red);font-size:0.6rem">-${fmt(dd.expense)}</div>` : ''}
      </div>`;
        }
        const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        document.getElementById('page-calendar').innerHTML = `
      <div class="calendar-header">
        <button class="cal-nav" onclick="shiftCalendar(-1)">←</button>
        <div class="cal-month">${monthLabel(State.calendarDate)}</div>
        <button class="cal-nav" onclick="shiftCalendar(1)">→</button>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-3)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(16,185,129,0.2);display:inline-block"></span>Low</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-3)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(245,158,11,0.2);display:inline-block"></span>Medium</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-3)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(239,68,68,0.28);display:inline-block"></span>High</div>
      </div>
      <div class="card" style="padding:16px">
        <div class="calendar-grid">
          ${DAYS.map(d => `<div class="cal-day-header">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>`;
      } catch (e) { document.getElementById('page-calendar').innerHTML = errCard(e.message); }
    }

    function dueItemHTML(d, settled = false) {

      const pct = total > 0 ? Math.min((paid / total) * 100, 100) : 0;
      const hasPartial = paid > 0 && paid < total;
      return `<div class="due-item" style="flex-direction:column;align-items:stretch;gap:10px">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="due-avatar">${d.name.charAt(0).toUpperCase()}</div>
      <div class="due-meta" style="flex:1">

        <div class="due-reason">${d.reason || 'No reason'} · ${dateLabel(d.date)}</div>
        ${d.banks ? `<div style="font-size:0.72rem;color:var(--text-3);margin-top:2px">${d.banks.icon} ${d.banks.name}</div>` : ''}
      </div>
      <div class="due-right" style="text-align:right">
        <div class="due-amount ${d.due_type}" style="font-size:0.9rem">${d.due_type === 'lent' ? 'Lent' : 'Borrowed'} ${fmt(total)}</div>
        ${hasPartial ? `<div style="font-size:0.75rem;color:var(--green);margin-top:2px">Paid: ${fmt(paid)}</div>` : ''}
        ${!settled ? `<div style="font-size:0.75rem;color:var(--amber);font-weight:600;margin-top:2px">Remaining: ${fmt(remaining)}</div>` : ''}
      </div>
    </div>
    ${hasPartial || paid > 0 ? `<div>
      <div class="progress-bar" style="margin:0 0 4px"><div class="progress-fill" style="width:${pct.toFixed(1)}%;background:var(--green)"></div></div>
      <div style="font-size:0.7rem;color:var(--text-3);text-align:right">${pct.toFixed(0)}% paid back</div>
    </div>`: ''}
    ${!settled
          ? `<div class="due-actions" style="justify-content:flex-start;gap:8px">
          <button class="btn-secondary" style="padding:5px 12px;font-size:0.78rem" onclick="openPartialPayment('${d.id}','${d.name}',${remaining},'${d.bank_id || ''}')">💰 Partial</button>
          <button class="btn-done" onclick="settleDue('${d.id}')">✓ Fully Done</button>
          <button class="txn-del" style="opacity:1" onclick="deleteDue('${d.id}')">🗑️</button>
        </div>`
          : `<div class="due-actions" style="justify-content:flex-start;gap:8px">
          <div style="font-size:0.72rem;color:var(--green);display:flex;align-items:center;gap:4px">✅ Settled ${d.settled_at ? dateLabel(d.settled_at.split('T')[0]) : ''}</div>

    // ── REPORT PAGE ───────────────────────────────────────────────────
    async function renderReport() {
      const reportMonth = State.txnMonth || monthStr(new Date());
      document.getElementById('page-report').innerHTML = `<div class="flex-center" style="min-height:200px"><div class="spinner"></div></div>`;
      try {
        const [txns, cats, banks] = await Promise.all([
          Transactions.getAll({ month: reportMonth }),
          Categories.getAll(),
          Banks.getAll()
        ]);
        const expenses = txns.filter(t => t.type === 'expense');
        const incomes = txns.filter(t => t.type === 'income');
        const totalExp = expenses.reduce((s, t) => s + Number(t.amount), 0);
        const totalInc = incomes.reduce((s, t) => s + Number(t.amount), 0);
        const net = totalInc - totalExp;
        const savingsRate = totalInc > 0 ? Math.round((net / totalInc) * 100) : 0;
        const catTotals = {};
        expenses.forEach(t => { const n = t.categories?.name || 'Other'; catTotals[n] = (catTotals[n] || 0) + Number(t.amount); });
        const topCat = Object.entries(catTotals).sort((a, b) => b[1] - a[1])[0];
        const txnDays = new Set(expenses.map(t => t.date)).size;
        const avgDaily = txnDays ? Math.round(totalExp / txnDays) : 0;

        document.getElementById('page-report').innerHTML = `
      <div class="section-header mb-4">
        <div class="section-title">Monthly Report</div>
        <input type="month" class="form-input" style="width:auto;padding:8px 12px"
          value="${reportMonth}" onchange="State.txnMonth=this.value;renderReport()">
      </div>
      <div class="report-highlight mb-4">
        <div style="font-size:0.8rem;opacity:0.7;margin-bottom:4px">${monthLabel(new Date(reportMonth + '-01'))}</div>
        <div style="font-family:var(--font-head);font-size:2rem;font-weight:700;letter-spacing:-0.03em">${fmt(totalExp)}</div>
        <div style="font-size:0.85rem;opacity:0.8;margin-top:2px">Total Spent</div>
      </div>
      <div class="grid-4 mb-4">
        <div class="stat-card income"><div class="stat-label">Income</div><div class="stat-value" style="font-size:1.3rem">${fmt(totalInc)}</div></div>
        <div class="stat-card expense"><div class="stat-label">Expenses</div><div class="stat-value" style="font-size:1.3rem">${fmt(totalExp)}</div></div>
        <div class="stat-card"><div class="stat-label">Savings Rate</div><div class="stat-value" style="font-size:1.3rem;color:${savingsRate >= 0 ? 'var(--green)' : 'var(--red)'}">${savingsRate}%</div></div>
        <div class="stat-card"><div class="stat-label">Avg Daily Spend</div><div class="stat-value" style="font-size:1.3rem">${fmt(avgDaily)}</div></div>
      </div>
      ${topCat ? `<div class="card mb-4">
        <div class="card-title mb-4">Top Spending Category</div>
        <div style="display:flex;align-items:center;gap:16px">
          <div style="font-size:2.5rem">${cats.find(c => c.name === topCat[0])?.icon || '📌'}</div>
          <div><div style="font-family:var(--font-head);font-size:1.1rem;font-weight:700">${topCat[0]}</div>
            <div style="font-size:0.85rem;color:var(--text-2)">${fmt(topCat[1])} · ${totalExp > 0 ? Math.round((topCat[1] / totalExp) * 100) : 0}% of total</div>
          </div>
        </div>
      </div>`: ''}
      ${Object.keys(catTotals).length ? `<div class="card mb-4">
        <div class="card-title mb-4">Category Breakdown</div>
        ${Object.entries(catTotals).sort((a, b) => b[1] - a[1]).map(([name, amt]) => {
          const cat = cats.find(c => c.name === name);
          const pct = totalExp > 0 ? Math.round((amt / totalExp) * 100) : 0;
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div style="display:flex;align-items:center;gap:8px;font-size:0.875rem;font-weight:500">
                <span>${cat?.icon || '📌'}</span>${name}
              </div>
              <div style="font-weight:700;font-size:0.875rem">${fmt(amt)} <span style="font-weight:400;color:var(--text-3)">(${pct}%)</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${cat?.color || '#94a3b8'}"></div></div>
          </div>`;
        }).join('')}
      </div>`: ''}
      ${!txns.length ? `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">No transactions found for ${monthLabel(new Date(reportMonth + '-01'))}</div></div>` : ''}
      <button class="btn-primary" onclick="exportCSV('${reportMonth}')">📥 Export as CSV</button>`;
      } catch (e) {
        console.error('Report error:', e);
        document.getElementById('page-report').innerHTML = errCard(e.message);
      }
    }

    </label></div>

    function setTxnType(t) {
      currentTxnType = t;
      document.getElementById('type-expense').className = `type-btn expense ${t === 'expense' ? 'active' : ''}`;
      document.getElementById('type-income').className = `type-btn income  ${t === 'income' ? 'active' : ''}`;
    }
    function toggleRecurring(on) { document.getElementById('recurring-opts').style.display = on ? 'block' : 'none'; }

    async function submitAddTxn() {
      const amount = parseFloat(document.getElementById('txn-amount').value);
      const bank_id = document.getElementById('txn-bank').value;
      const cat_id = document.getElementById('txn-cat').value;
      const date = document.getElementById('txn-date').value;
      const note = document.getElementById('txn-note').value;
      const isRec = document.getElementById('txn-recurring').checked;
      const interval = isRec ? document.getElementById('txn-interval').value : null;
      if (!amount || amount <= 0) { toast('Enter a valid amount', 'error'); return; }
      if (!bank_id) { toast('Select a bank', 'error'); return; }
      if (!date) { toast('Select a date', 'error'); return; }
      try {
        await Transactions.add({ bank_id, category_id: cat_id || null, type: currentTxnType, amount, note, date, is_recurring: isRec, recurring_interval: interval });
        closeModal();
        toast('Transaction added! 💰', 'success');
        State.banks = await Banks.getAll();
        renderPage(State.currentPage);
      } catch (e) { toast('Error: ' + e.message, 'error'); console.error(e); }
    }

    const BANK_ICONS = ['🏦', '💳', '🏧', '💰', '🏛️', '💵', '🌐', '📱', '🔑', '💎'];
    let selectedColor = BANK_COLORS[0], selectedIcon = BANK_ICONS[0], editBankId = null;

    function openAddBank() { editBankId = null; selectedColor = BANK_COLORS[0]; selectedIcon = BANK_ICONS[0]; showBankModal(); }

      editBankId = id;
      const b = State.banks.find(b => b.id === id);
      if (!b) return;
      selectedColor = b.color; selectedIcon = b.icon; showBankModal(b);

      openModal(b.id ? 'Edit Bank' : 'Add Bank Account', `

      <input class="form-input" id="bank-name" type="text" placeholder="e.g. SBI Savings, HDFC, GPay" value="${b.name || ''}"></div>
    <div class="form-group"><label class="form-label">Current Balance (₹) *</label>

    async function submitDue() {
      const name = document.getElementById('due-name').value.trim();
      const amount = parseFloat(document.getElementById('due-amount').value);
      const date = document.getElementById('due-date').value;
      const reason = document.getElementById('due-reason').value;

      if (!amount || amount <= 0) { toast('Enter valid amount', 'error'); return; }
      try {
        // Save the due entry
        await PeopleDues.add({ name, amount, reason, date, due_type: currentDueType, bank_id });

        // Update bank balance immediately if a bank is selected
        if (bank_id) {
          const { data: bank, error: be } = await getDb().from('banks')
            .select('balance').eq('id', bank_id).single();
          if (be) throw be;
          const newBal = currentDueType === 'lent'
            ? Number(bank.balance) - amount   // deduct — money left your account
            : Number(bank.balance) + amount;  // add — money came into your account
          const { error: ue } = await getDb().from('banks')
            .update({ balance: newBal }).eq('id', bank_id);
          if (ue) throw ue;
        }

        closeModal();
        toast(currentDueType === 'lent' ? 'Lent recorded & balance deducted 💸' : 'Borrowed recorded & balance added 💰', 'success');

        renderPeople();
