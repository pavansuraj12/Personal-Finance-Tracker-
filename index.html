      if (!name) { toast('Enter name', 'error'); return; }
      try { await Categories.add({ name, icon: selectedCatIcon, color: selectedCatColor }); State.categories = await Categories.getAll(); closeModal(); toast('Category added!', 'success'); renderSettings(); }
      catch (e) { toast('Error: ' + e.message, 'error'); }
    }
    async function deleteCat(id) {
      if (!confirm('Delete this category?')) return;
      await Categories.delete(id); State.categories = await Categories.getAll(); toast('Deleted', 'info'); renderSettings();
    }

    // Txn detail modal
    async function openTxnDetail(id) {
      try {
        const t = await Transactions.getById(id);
        const cat = t.categories || {};
        openModal('Transaction Detail', `
      <div style="text-align:center;padding:16px 0">
        <div style="font-size:3rem;margin-bottom:8px">${cat.icon || '📌'}</div>
        <div style="font-family:var(--font-head);font-size:2rem;font-weight:700;color:${t.type === 'expense' ? 'var(--red)' : 'var(--green)'}">
          ${t.type === 'expense' ? '-' : '+'}${fmt(t.amount)}</div>
        <div style="color:var(--text-2);margin-top:4px">${t.note || cat.name || ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg-3);border-radius:var(--radius-sm)">
          <span style="color:var(--text-2);font-size:0.85rem">Category</span><span style="font-weight:600;font-size:0.85rem">${cat.name || 'None'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg-3);border-radius:var(--radius-sm)">
          <span style="color:var(--text-2);font-size:0.85rem">Bank</span><span style="font-weight:600;font-size:0.85rem">${t.banks?.icon || ''} ${t.banks?.name || 'Unknown'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg-3);border-radius:var(--radius-sm)">
          <span style="color:var(--text-2);font-size:0.85rem">Date</span><span style="font-weight:600;font-size:0.85rem">${dateLabel(t.date)}</span></div>
        ${t.is_recurring ? `<div style="display:flex;justify-content:space-between;padding:12px;background:var(--amber-bg);border-radius:var(--radius-sm)">
          <span style="color:var(--amber);font-size:0.85rem">🔄 Recurring</span><span style="font-weight:600;font-size:0.85rem;color:var(--amber)">${t.recurring_interval}</span></div>` : ''}
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn-secondary" onclick="closeModal()">Close</button>
        <button class="btn-primary" style="background:var(--accent)" onclick="closeModal();openEditTxn('${t.id}')">✏️ Edit</button>
        <button class="btn-primary" style="background:var(--red)" onclick="deleteTxnFromModal('${t.id}')">🗑️ Delete</button>
      </div>`);
      } catch (e) { toast('Error loading transaction', 'error'); }
    }
    async function deleteTxnFromModal(id) {
      if (!confirm('Delete this transaction? Bank balance will be reversed.')) return;
      try { await Transactions.delete(id); closeModal(); toast('Deleted & balance reversed', 'info'); State.banks = await Banks.getAll(); renderPage(State.currentPage); }
      catch (e) { toast('Error: ' + e.message, 'error'); }
    }
    async function deleteTxn(id) {
      if (!confirm('Delete this transaction?')) return;
      try { await Transactions.delete(id); toast('Deleted & balance reversed', 'info'); State.banks = await Banks.getAll(); renderPage(State.currentPage); }
      catch (e) { toast('Error: ' + e.message, 'error'); }
    }

    // ── EXPORT CSV ────────────────────────────────────────────────────
    async function exportCSV(month) {
      try {
        const m = month || State.txnMonth || monthStr(new Date());
        const txns = await Transactions.getAll({ month: m });
        if (!txns.length) { toast('No transactions to export for this month', 'info'); return; }
        const rows = [['Date', 'Type', 'Amount', 'Category', 'Bank', 'Note', 'Recurring']];
        txns.forEach(t => rows.push([t.date, t.type, t.amount, t.categories?.name || '', t.banks?.name || '', t.note || '', t.is_recurring ? t.recurring_interval : 'no']));
        const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `fintrack-${m}.csv`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
        toast(`Exported ${txns.length} transactions ✅`, 'success');
      } catch (e) { toast('Export failed: ' + e.message, 'error'); console.error(e); }
    }

    // ── MODAL HELPERS ──────────────────────────────────────────────────
    function openModal(title, content) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-content').innerHTML = content;
      document.getElementById('modal-overlay').classList.add('open');
    }
    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    function toggleMoreMenu() { document.getElementById('more-menu').classList.toggle('open'); }
    function closeMoreMenu() { document.getElementById('more-menu').classList.remove('open'); }

    // ── INIT ──────────────────────────────────────────────────────────
    async function init() {
      initPin();
      document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => toggleTheme(b.dataset.theme)));
      document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
      document.getElementById('day-panel-close').addEventListener('click', () => document.getElementById('day-panel').classList.remove('open'));
      document.addEventListener('click', e => {
        const mm = document.getElementById('more-menu');
        if (mm.classList.contains('open') && !mm.contains(e.target) && !e.target.closest('[onclick="toggleMoreMenu()"]')) closeMoreMenu();
      });

      if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE')) {
        document.querySelector('.pin-subtitle').textContent = '⚠️ Open this file in a text editor and add your Supabase URL and Anon Key first.';
        document.querySelector('.pin-subtitle').style.cssText = 'color:var(--amber);max-width:280px;text-align:center;line-height:1.5';
        return;
      }

      try {
        State.settings = await Settings.get();
        applyTheme(State.settings?.theme || 'dark');
        if (!State.settings?.pin_hash) { pinSetupMode = true; document.querySelector('.pin-subtitle').textContent = 'Set a 4-digit PIN to secure your data'; }
        else { document.querySelector('.pin-subtitle').textContent = 'Enter your PIN to continue'; }
      } catch (e) {
        console.error('Init error:', e);
        document.querySelector('.pin-subtitle').textContent = '⚠️ Cannot reach Supabase — check your keys.';
        document.querySelector('.pin-subtitle').style.cssText = 'color:var(--red);max-width:280px;text-align:center';
      }
    }
    document.addEventListener('DOMContentLoaded', init);

  </script>
</body>

</html>
